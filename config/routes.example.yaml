# Route Configuration
# Defines which agent handles each platform + conversation pair.
#
# Top-level fields:
#   agentList          - All known agent names (validated at startup)
#   platforms          - Per-platform routing config
#
# Per-platform:
#   defaultAgent       - Agent used when no conversation route matches
#   conversationRoutes - Map of conversationId -> {agent, model, workdir}
#                        Use "null" for private chat / default route
#
# Hot reload: Changes to this file are automatically picked up without server restart.

agentList:
  - general-agent
  - warehouse-agent

platforms:
  line:
    defaultAgent: general-agent
    conversationRoutes:
      "null":
        agent: general-agent
        model: claude-haiku-4.5
        workdir: ~/code/chatpilot/
      "C1234567890abcdef":
        agent: warehouse-agent
        model: claude-haiku-4.5
        workdir: ~/code/chatpilot/
  mock:
    defaultAgent: general-agent
    conversationRoutes:
      "null":
        agent: general-agent
        model: gpt-4.1
        workdir: ~/code/chatpilot/
