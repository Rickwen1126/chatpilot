# Route Map Configuration
# Each route maps a (platform, conversationId) pair to keyword-based agent routing.
#
# Fields:
#   platform       - Platform identifier (e.g., "line")
#   conversationId - Group/room ID; null for private chat rules
#   keywords       - List of {keyword, agentName} for substring matching (checked in order)
#   fallbackAgent  - Agent to use when no keyword matches; null = silently ignore
#
# Hot reload: Changes to this file are automatically picked up without server restart.

routes:
  # Group A: keyword routing + fallback
  - platform: line
    conversationId: "C1234567890abcdef"
    keywords:
      - keyword: "庫存"
        agentName: warehouse-agent
      - keyword: "報表"
        agentName: report-agent
    fallbackAgent: general-agent

  # Group B: fallback only (all messages go to general-agent)
  - platform: line
    conversationId: "C0987654321fedcba"
    keywords: []
    fallbackAgent: general-agent

  # Private chat rule: any 1:1 message goes to general-agent
  - platform: line
    conversationId: null
    keywords: []
    fallbackAgent: general-agent
