# ChatPilot route settings configuration
# Copy to route_settings.yaml and customize together with route_bindings.yaml.

timezone: "Asia/Taipei"

adapters:
  line:
    - name: demo
      channel_secret_env: DEMO_LINE_CHANNEL_SECRET
      channel_token_env: DEMO_LINE_CHANNEL_ACCESS_TOKEN

trigger_keywords: ["bot"]

match_weights:
  group_id: 10
  user_id: 8
  platform: 5

route_groups:
  ops:
    description: Example shared observation group

observation_profiles:
  ops_batch:
    mode: batch
    batch_size: 10
    instructions: |
      Summarize operational knowledge from the source route.
      Ignore pure chit-chat and keep only reusable background knowledge.
    categories: [leave, inventory, shipping]
    retrieval:
      description: |
        Suitable for leave, inventory, inbound, outbound, and general
        operational context queries.
      keywords: [leave, vacation, inventory, stock, inbound, outbound, shipping]

discovery_profiles:
  default_group_safe:
    chatbot: buddy
    reply_policy: never
    processing_policy: none

  ops_capture:
    chatbot: buddy
    reply_policy: never
    processing_policy: none
    observation:
      capture:
        group: ops
        profile: ops_batch

  default_private_cheap:
    chatbot: buddy
    reply_policy: addressed
    processing_policy: interactive

discovery_rules:
  - platform: line:demo
    route_type: group
    label_keywords: ["營運", "倉庫", "油漆"]
    profile: ops_capture
  - platform: line:demo
    route_type: group
    profile: default_group_safe
  - platform: line:demo
    route_type: user
    profile: default_private_cheap

chatbots:
  buddy:
    model: gpt-5.4-mini
    system_message: |
      You are a friendly, helpful assistant.
      Reply concisely. Use web_search when you need up-to-date information.
      You may only use the tools explicitly provided to you.
      In group chats, [背景] messages are others' chatter for context.
      Messages after --- are directed at you.
    tools: [get_calendar, web_search, download_media, save_memo, list_memos, delete_memo, save_custom_prompt, list_custom_prompts, delete_custom_prompt, add_reminder, schedule_task_cron, list_schedules, cancel_schedule]
    context_window: 50
    timeout: 300

  my-assistant:
    model: gpt-5.4-mini
    system_message: |
      You are a domain-specific assistant with warehouse and document tools.
      When you need observed operational history, first use
      list_observation_candidates(group=ops, query=...),
      then use query_observation_member(route_id=..., query=...).
      The shortlist itself is not the answer; always query at least one member route.
      query_observations is a compatibility fallback only.
      Reply concisely. Use tools to complete tasks, don't describe what you would do.
    tools: [get_calendar, warehouse, quote_search, document_edit, web_search, download_media, show_image, list_observation_candidates, query_observation_member, query_observations, save_memo, list_memos, delete_memo, save_custom_prompt, list_custom_prompts, delete_custom_prompt, add_reminder, schedule_task_cron, list_schedules, cancel_schedule, manage_trigger_keywords]
    context_window: 50
    timeout: 300
    auto_trigger_keywords: []

agents: {}

scheduler:
  concurrent_runners: 2
  max_queue_size: 100
  task_timeout: 300

cron_scheduler:
  tick_interval: 60
  available_tools: [schedule-agent, general-agent, browser-search, echo]
