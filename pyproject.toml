[project]
name = "chatpilot"
version = "0.1.0"
description = "Universal channel-to-agent gateway powered by GitHub Copilot SDK"
requires-python = ">=3.11"
dependencies = [
    "github-copilot-sdk",
    "line-bot-sdk",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "watchdog",
    "pyyaml",
    "python-dotenv",
]

[project.scripts]
chatpilot-cli = "chatpilot.cli.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatpilot"]
